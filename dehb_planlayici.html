<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow | Profesyonel Planlayıcı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Theme Variables */
            --bg-body: #f8fafc;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5; /* Indigo 600 */
            --primary-hover: #4338ca;
            --secondary: #0ea5e9; /* Sky 500 */
            --accent: #8b5cf6; /* Violet 500 */
            --success: #10b981;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --sidebar-width: 260px;
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3);
        }

        * {
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Sidebar */
        aside {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--text-secondary);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .nav-item:hover, .nav-item.active {
            background-color: rgba(79, 70, 229, 0.1);
            color: var(--primary);
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
        }

        .spacer {
            flex-grow: 1;
        }

        /* Main Content */
        main {
            flex-grow: 1;
            padding: 2rem;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
            aside {
                position: fixed;
                left: -100%;
                height: 100%;
                z-index: 100;
            }
            aside.open {
                left: 0;
                box-shadow: 10px 0 20px rgba(0,0,0,0.1);
            }
            .menu-toggle {
                display: block;
            }
        }

        @media (min-width: 1025px) {
            .menu-toggle {
                display: none;
            }
        }

        /* Cards */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: box-shadow 0.3s;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .card-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-body {
            padding: 1.25rem;
            flex-grow: 1;
            overflow-y: auto;
        }

        /* Components */
        .brain-dump-area {
            width: 100%;
            height: 100%;
            min-height: 400px;
            border: none;
            resize: none;
            background: transparent;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .time-slot {
            display: grid;
            grid-template-columns: 60px 1fr 40px;
            align-items: center;
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .time-slot:last-child {
            border-bottom: none;
        }

        .time-slot:hover {
            background-color: rgba(0,0,0,0.02);
        }

        [data-theme="dark"] .time-slot:hover {
            background-color: rgba(255,255,255,0.02);
        }

        .time-slot.active {
            background-color: rgba(79, 70, 229, 0.05);
            border-left: 3px solid var(--primary);
            padding-left: calc(0.5rem - 3px);
        }

        .time-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .task-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            color: var(--text-primary);
            padding: 0.25rem 0.5rem;
        }

        .check-circle {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .check-circle:hover {
            border-color: var(--primary);
        }

        .time-slot.completed .check-circle {
            background-color: var(--success);
            border-color: var(--success);
            color: white;
        }

        .time-slot.completed .task-input {
            text-decoration: line-through;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: var(--radius-lg);
            width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-body);
            color: var(--text-primary);
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }

        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { border: 1px solid var(--border-color); background: transparent; color: var(--text-primary); }
        .btn-ghost { background: transparent; color: var(--text-secondary); padding: 0.5rem; }
        .btn-ghost:hover { background: rgba(0,0,0,0.05); color: var(--text-primary); }

        /* Progress Ring */
        .progress-ring {
            position: relative;
            width: 32px;
            height: 32px;
        }
        .progress-ring circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Icons */
        .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    </style>
</head>
<body>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <h3 style="margin-top:0">Ayarlar</h3>
        <div class="form-group">
            <label class="form-label">Başlangıç Saati</label>
            <input type="number" id="settingStartHour" class="form-input" min="0" max="23" value="7">
        </div>
        <div class="form-group">
            <label class="form-label">Bitiş Saati</label>
            <input type="number" id="settingEndHour" class="form-input" min="0" max="24" value="24">
        </div>
        <div style="display:flex; justify-content: flex-end; gap: 10px;">
            <button class="btn btn-outline" onclick="toggleModal('settingsModal', false)">İptal</button>
            <button class="btn btn-primary" onclick="saveSettings()">Kaydet</button>
        </div>
    </div>
</div>

<aside>
    <div class="brand">
        <svg class="icon" style="color:var(--primary)" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>
        FocusFlow
    </div>

    <div class="nav-item active">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        Planlama
    </div>
    <div class="nav-item" onclick="toggleModal('settingsModal', true)">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        Saat Ayarları
    </div>

    <div class="spacer"></div>

    <div class="nav-item" onclick="toggleTheme()">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <span id="themeLabel">Koyu Mod</span>
    </div>
    <div class="nav-item" style="color:var(--danger)" onclick="resetDay()">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        Günü Sıfırla
    </div>
</aside>

<main>
    <!-- Left Column: Brain Dump -->
    <div class="card" style="height: calc(100vh - 4rem);">
        <div class="card-header">
            <span class="card-title">🧠 Zihin Deposu</span>
            <button class="btn btn-ghost" onclick="clearBrainDump()" title="Temizle">
                <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
            </button>
        </div>
        <div class="card-body">
            <textarea id="brainDumpArea" class="brain-dump-area" placeholder="Aklına gelenleri buraya yaz..."></textarea>
        </div>
    </div>

    <!-- Right Column: Schedule -->
    <div class="card" style="height: calc(100vh - 4rem);">
        <div class="card-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <span class="card-title">📅 Günlük Akış</span>
                <span id="currentDate" style="color:var(--text-secondary); font-size:0.9rem; font-weight:normal;"></span>
            </div>
            <div style="display:flex; align-items:center; gap:15px;">
                <!-- Circular Progress -->
                <div class="progress-ring">
                    <svg width="32" height="32">
                        <circle stroke="var(--border-color)" stroke-width="4" fill="transparent" r="14" cx="16" cy="16"/>
                        <circle id="progressCircle" stroke="var(--success)" stroke-width="4" fill="transparent" r="14" cx="16" cy="16" stroke-dasharray="87.96" stroke-dashoffset="87.96"/>
                    </svg>
                </div>
                <button class="btn btn-primary" onclick="exportToExcel()" style="padding:0.5rem 1rem; font-size:0.8rem;">Excel İndir</button>
            </div>
        </div>
        <div class="card-body" id="scheduleContainer">
            <div class="schedule-list" id="scheduleList">
                <!-- Time slots -->
            </div>
        </div>
    </div>
</main>

<script>
    // State
    let config = {
        startHour: 7,
        endHour: 24,
        theme: 'light'
    };

    // Elements
    const scheduleList = document.getElementById('scheduleList');
    const brainDumpArea = document.getElementById('brainDumpArea');
    const progressCircle = document.getElementById('progressCircle');
    const circleCircumference = 2 * Math.PI * 14;

    function init() {
        loadConfig();
        applyTheme();
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('tr-TR', {weekday:'long', month:'long', day:'numeric'});

        loadData(); // Load data first to check if we have old schedule data
        renderSchedule(); // Render based on config
        restoreScheduleData(); // Fill inputs

        updateTimeHighlight();
        updateProgress();

        setInterval(updateTimeHighlight, 60000);

        // Listeners
        brainDumpArea.addEventListener('input', () => {
            localStorage.setItem('focusflow_dump', brainDumpArea.value);
        });
    }

    function loadConfig() {
        const saved = localStorage.getItem('focusflow_config');
        if (saved) {
            config = JSON.parse(saved);
        }
        document.getElementById('settingStartHour').value = config.startHour;
        document.getElementById('settingEndHour').value = config.endHour;
    }

    function saveConfig() {
        localStorage.setItem('focusflow_config', JSON.stringify(config));
    }

    function toggleModal(id, show) {
        document.getElementById(id).style.display = show ? 'flex' : 'none';
    }

    function saveSettings() {
        const s = parseInt(document.getElementById('settingStartHour').value);
        const e = parseInt(document.getElementById('settingEndHour').value);

        if (s >= e) {
            alert("Başlangıç saati bitiş saatinden küçük olmalıdır.");
            return;
        }

        // Save current schedule data before re-rendering to prevent loss if just resizing
        saveScheduleData();

        config.startHour = s;
        config.endHour = e;
        saveConfig();

        renderSchedule();
        restoreScheduleData(); // Restore what fits
        toggleModal('settingsModal', false);
    }

    function renderSchedule() {
        scheduleList.innerHTML = '';
        for (let i = config.startHour; i < config.endHour; i++) { // Using < for hour slots (e.g., 7:00 - 8:00 is the 7 slot)
            const hour = i;
            const displayHour = (i < 10 ? '0' : '') + i + ':00';

            const div = document.createElement('div');
            div.className = 'time-slot';
            div.dataset.hour = i;

            div.innerHTML = `
                <div class="time-label">${displayHour}</div>
                <input type="text" class="task-input" placeholder="" oninput="saveScheduleData()">
                <div class="check-circle" onclick="toggleTask(this)">
                    <svg class="icon" style="width:14px;height:14px;stroke-width:3;" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
            `;
            scheduleList.appendChild(div);
        }
    }

    function toggleTask(el) {
        const row = el.parentElement;
        row.classList.toggle('completed');
        saveScheduleData();
        updateProgress();
    }

    function updateProgress() {
        const total = document.querySelectorAll('.time-slot').length;
        const completed = document.querySelectorAll('.time-slot.completed').length;
        const percent = total === 0 ? 0 : completed / total;

        const offset = circleCircumference - (percent * circleCircumference);
        progressCircle.style.strokeDashoffset = offset;
    }

    function updateTimeHighlight() {
        const currentHour = new Date().getHours();
        document.querySelectorAll('.time-slot').forEach(slot => {
            slot.classList.remove('active');
            if (parseInt(slot.dataset.hour) === currentHour) {
                slot.classList.add('active');
                // Optional: scroll into view if needed
            }
        });
    }

    // Data Persistence
    function saveScheduleData() {
        const data = {};
        document.querySelectorAll('.time-slot').forEach(slot => {
            const h = slot.dataset.hour;
            data[h] = {
                text: slot.querySelector('.task-input').value,
                done: slot.classList.contains('completed')
            };
        });
        localStorage.setItem('focusflow_schedule', JSON.stringify(data));
    }

    function restoreScheduleData() {
        const raw = localStorage.getItem('focusflow_schedule');
        if (!raw) return;
        const data = JSON.parse(raw);

        document.querySelectorAll('.time-slot').forEach(slot => {
            const h = slot.dataset.hour;
            if (data[h]) {
                slot.querySelector('.task-input').value = data[h].text;
                if (data[h].done) slot.classList.add('completed');
            }
        });
        updateProgress();
    }

    function loadData() {
        const dump = localStorage.getItem('focusflow_dump');
        if (dump) brainDumpArea.value = dump;
    }

    function resetDay() {
        if (confirm("Günü sıfırlamak istiyor musun?")) {
            brainDumpArea.value = '';
            localStorage.setItem('focusflow_dump', '');
            document.querySelectorAll('.task-input').forEach(i => i.value = '');
            document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('completed'));
            saveScheduleData();
            updateProgress();
        }
    }

    function clearBrainDump() {
        if(confirm("Zihin deposunu temizle?")) {
            brainDumpArea.value = '';
            localStorage.setItem('focusflow_dump', '');
        }
    }

    function toggleTheme() {
        config.theme = config.theme === 'light' ? 'dark' : 'light';
        applyTheme();
        saveConfig();
    }

    function applyTheme() {
        document.documentElement.setAttribute('data-theme', config.theme);
        document.getElementById('themeLabel').innerText = config.theme === 'light' ? 'Koyu Mod' : 'Aydınlık Mod';
    }

    function exportToExcel() {
        let csv = "\ufeffTarih;Saat;Görev;Durum\n";
        const date = new Date().toLocaleDateString('tr-TR');

        document.querySelectorAll('.time-slot').forEach(slot => {
            const time = slot.querySelector('.time-label').innerText;
            const text = slot.querySelector('.task-input').value.replace(/"/g, '""'); // Escape quotes
            const status = slot.classList.contains('completed') ? "Tamamlandı" : "Bekliyor";
            csv += `${date};${time};"${text}";${status}\n`;
        });

        // Add Brain Dump
        csv += `\n\nZİHİN DEPOSU\n"${brainDumpArea.value.replace(/"/g, '""')}"`;

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Plan_${date}.csv`;
        link.click();
    }

    init();

</script>
</body>
</html>
