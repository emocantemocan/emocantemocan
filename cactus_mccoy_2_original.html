<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cactus McCoy 2</title>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-container {
            width: 800px;
            height: 600px;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h1 {
            margin-bottom: 10px;
        }
        .info {
            margin-top: 15px;
            text-align: center;
            max-width: 600px;
            font-size: 14px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Cactus McCoy 2</h1>

    <div id="game-container"></div>

    <div class="info">
        <p>Oyun Ruffle emülatörü kullanılarak çalıştırılmaktadır.</p>
        <p>Eğer oyun yüklenmezse, güvenlik ayarları veya bağlantı sorunu olabilir.</p>
        <p><strong>Not:</strong> Orijinal "Cactus McCoy 2" Flash oyunudur.</p>
    </div>

    <!-- Ruffle Emülatörünü Yükle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("game-container");
            container.appendChild(player);

            player.load({
                url: "https://archive.org/download/cactus-mccoy-flash-game-series/CactusMcCoy2.swf",
                backgroundColor: "#000000",
                width: 800,
                height: 600
            });
        });
    </script>

</body>
</html>
