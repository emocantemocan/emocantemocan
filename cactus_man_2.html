<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katüs Adam 2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify_content: center;
            align-items: center;
            height: 100vh;
            background-color: #87CEEB; /* Gökyüzü mavisi */
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        #gameCanvas {
            border: 4px solid #4a3b2b;
            background-color: #f0e68c; /* Çöl kumu rengi */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
        }
        h1 {
            color: #2c3e50;
            text-shadow: 2px 2px #fff;
            margin: 0;
        }
        #scoreBoard {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 20px 40px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #27ae60;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>KATÜS ADAM 2</h1>
        <div id="scoreBoard">Skor: 0</div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div id="startScreen">
        <h2>Maceraya Hazır mısın?</h2>
        <p>Zıplamak için BOŞLUK (Space) tuşuna veya ekrana tıkla!</p>
        <button onclick="startGame()">Oyunu Başlat</button>
    </div>

    <div id="gameOverScreen" class="hidden">
        <h2>Oyun Bitti!</h2>
        <p>Skorun: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">Tekrar Oyna</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreBoard'); // Fix: Use correct ID
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreEl = document.getElementById('finalScore');

        let gameRunning = false;
        let score = 0;
        let frameCount = 0;
        let gameSpeed = 5;

        // Kaktüs Adam Karakteri
        const player = {
            x: 50,
            y: 300,
            width: 40,
            height: 60,
            dy: 0,
            jumpForce: 12,
            gravity: 0.6,
            grounded: false,
            color: '#2ecc71',
            draw: function() {
                // Gövde
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Kollar
                ctx.fillRect(this.x - 10, this.y + 20, 10, 10);
                ctx.fillRect(this.x - 10, this.y + 10, 10, 10);

                ctx.fillRect(this.x + this.width, this.y + 20, 10, 10);
                ctx.fillRect(this.x + this.width, this.y + 10, 10, 10);

                // Gözler
                ctx.fillStyle = 'white';
                ctx.fillRect(this.x + 10, this.y + 10, 8, 8);
                ctx.fillRect(this.x + 25, this.y + 10, 8, 8);
                ctx.fillStyle = 'black';
                ctx.fillRect(this.x + 12, this.y + 12, 4, 4);
                ctx.fillRect(this.x + 27, this.y + 12, 4, 4);

                // Dikenler
                ctx.fillStyle = '#1e8449';
                ctx.fillRect(this.x + 20, this.y - 5, 2, 5);
                ctx.fillRect(this.x - 5, this.y + 30, 5, 2);
                ctx.fillRect(this.x + this.width, this.y + 40, 5, 2);
            },
            update: function() {
                // Zıplama mantığı
                if (input.jump && this.grounded) {
                    this.dy = -this.jumpForce;
                    this.grounded = false;
                }

                this.y += this.dy;

                // Yerçekimi
                if (this.y + this.height < canvas.height - 50) {
                    this.dy += this.gravity;
                    this.grounded = false;
                } else {
                    this.dy = 0;
                    this.grounded = true;
                    this.y = canvas.height - 50 - this.height;
                }
            }
        };

        // Engeller
        let obstacles = [];

        function spawnObstacle() {
            const size = Math.random() * 30 + 30;
            const type = Math.random() > 0.5 ? 'rock' : 'bird';

            let obstacle = {
                x: canvas.width,
                y: canvas.height - 50 - size,
                width: size,
                height: size,
                type: type,
                speed: gameSpeed,
                color: type === 'rock' ? '#7f8c8d' : '#e74c3c'
            };

            if (type === 'bird') {
                obstacle.y -= Math.random() * 100 + 20; // Havada
                obstacle.width = 40;
                obstacle.height = 30;
            }

            obstacles.push(obstacle);
        }

        // Kontroller
        const input = {
            jump: false
        };

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                input.jump = true;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                input.jump = false;
            }
        });

        document.addEventListener('mousedown', () => {
             input.jump = true;
        });

        document.addEventListener('mouseup', () => {
             input.jump = false;
        });

        document.addEventListener('touchstart', (e) => {
             e.preventDefault(); // Sayfa kaydırmayı engelle
             input.jump = true;
        }, {passive: false});

        document.addEventListener('touchend', (e) => {
             e.preventDefault();
             input.jump = false;
        }, {passive: false});


        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            resetGameVariables();
            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            startGame();
        }

        function resetGameVariables() {
            player.y = 300;
            player.dy = 0;
            obstacles = [];
            score = 0;
            gameSpeed = 5;
            frameCount = 0;
            scoreEl.innerText = 'Skor: ' + score;
        }

        function gameOver() {
            gameRunning = false;
            finalScoreEl.innerText = Math.floor(score);
            gameOverScreen.classList.remove('hidden');
        }

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Zemin çizimi
            ctx.fillStyle = '#d4ac0d';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

            // Güneş
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(700, 50, 40, 0, Math.PI * 2);
            ctx.fill();

            // Oyuncu güncelleme
            player.update();
            player.draw();

            // Engel mantığı
            frameCount++;
            if (frameCount % 100 === 0) { // Her 100 karede bir engel (yaklaşık 1.5 sn)
                spawnObstacle();
                gameSpeed += 0.1; // Oyun giderek hızlansın
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= obs.speed;

                // Engel çizimi
                ctx.fillStyle = obs.color;
                if (obs.type === 'rock') {
                    // Kaya şekli
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + obs.height);
                    ctx.lineTo(obs.x + obs.width / 2, obs.y);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                    ctx.fill();
                } else {
                    // Kuş şekli (basit dikdörtgen şimdilik)
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    // Kanat
                     ctx.fillStyle = 'white';
                     ctx.fillRect(obs.x + 10, obs.y + 10, 10, 5);
                }

                // Çarpışma Kontrolü
                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    gameOver();
                }

                // Ekrandan çıktıysa sil
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    i--;
                    score += 10;
                    scoreEl.innerText = 'Skor: ' + score;
                }
            }

            // Skor artışı (hayatta kaldıkça)
            score += 0.05;
            scoreEl.innerText = 'Skor: ' + Math.floor(score);

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
