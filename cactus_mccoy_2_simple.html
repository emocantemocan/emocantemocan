<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cactus McCoy 2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 800px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!--
            The game file (cactusmccoy2.swf) must be in the same folder as this HTML file.
            Ruffle will automatically find and play it.
        -->
        <object data="cactusmccoy2.swf" width="800" height="600" type="application/x-shockwave-flash">
            <param name="movie" value="cactusmccoy2.swf" />
            <param name="allowScriptAccess" value="always" />
            <param name="wmode" value="direct" />
            <!-- Fallback text if Ruffle doesn't load or file is missing -->
            <p style="color: white; text-align: center; padding-top: 200px; font-family: sans-serif;">
                Loading cactusmccoy2.swf...<br>
                Ensure the file is in the same directory.
            </p>
        </object>
    </div>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</body>
</html>
